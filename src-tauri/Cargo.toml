[package]
name = "wav2bar"
version = "1.0.0-beta.1"
description = "Free software for creating audio visualization (motion design) videos"
authors = ["Charly Schmidt aka Picorims(picorims.contact@gmail.com)"]
license = "MPL-2.0"
repository = "https://github.com/picorims/wav2bar-reborn"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1.0", features = [] }

[dependencies]
anyhow = "1.0.100"
chrono = {version = "0.4.42"}
log = "0.4"
log4rs = { version = "1.4.0", features = ["pattern_encoder"] }
num = "0.4.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
spectrum-analyzer = "1.7.0"
symphonia = { version = "0.5.5", features = ["mp3"] }
tauri = { version = "2.4.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2.3.1"
tauri-plugin-opener = "2.2.6"
walkdir = "2.5.0"
zip = "5.1.1"
tauri-plugin-fs = "2"
regex = "1.12.3"
tauri-plugin-os = "2"
tungstenite = "0.29.0"
tauri-plugin-shell = "2"
