[package]
name = "wav2bar"
version = "1.0.0-indev"
description = "Free software for creating audio visualization (motion design) videos"
authors = ["Charly Schmidt aka Picorims(picorims.contact@gmail.com)"]
license = "MPL-2.0"
repository = "https://github.com/picorims/wav2bar-reborn"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
log4rs = { version = "1.4.0", features = ["pattern_encoder"] }
chrono = {version = "0.4.42"}
tauri = { version = "2.4.0", features = [] }
tauri-plugin-log = "2.3.1"
tauri-plugin-opener = "2.2.6"

